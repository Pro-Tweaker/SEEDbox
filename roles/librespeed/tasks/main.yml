---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ librespeed.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: librespeed
    image: "ghcr.io/linuxserver/librespeed:{{ librespeed.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ librespeed.folder }}:/config"
    networks:
      - name: web
        aliases:
          - librespeed
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.librespeed.rule: "Host(`{{ librespeed.subdomain }}.{{ domain }}`)"
      traefik.http.routers.librespeed.entrypoints: "websecure"
      traefik.http.services.librespeed.loadbalancer.server.port: "80"
      traefik.http.routers.librespeed.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "LibreSpeed"
      homer.service: "Monitoring"
      homer.priority: "200"
      homer.subtitle: "FOSS Speedtest. No Bullshit."
      homer.url: "https://{{ librespeed.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/librespeed.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"
