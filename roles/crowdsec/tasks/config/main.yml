---
# LAPI only answers once the entrypoint is done (CAPI registration, hub install), which cscli console needs
- name: Wait for the CrowdSec LAPI
  ansible.builtin.uri:
    url: http://127.0.0.1:9876/health
  register: crowdsec_health
  until: crowdsec_health.status == 200
  retries: 40
  delay: 3

- name: Enroll CrowdSec console
  community.docker.docker_container_exec:
    container: crowdsec
    command: "cscli console enroll {{ crowdsec.console_enrollment_key }}"
  register: crowdsec_console_enroll
  failed_when: >
    crowdsec_console_enroll.rc != 0 and 'already enrolled' not in (crowdsec_console_enroll.stderr | default(''))
  # The console account is optional: skip without a real key (empty, or the old placeholder)
  when: (crowdsec.console_enrollment_key | default('', true) | string) not in ['', 'console_enrollment_key']

- name: Enroll CrowdSec Firewall Bouncer
  community.docker.docker_container_exec:
    container: crowdsec
    command: "cscli bouncers add firewall-bouncer --key {{ crowdsec.firewall_bouncer_key }}"
  register: crowdsec_bouncer_enroll
  failed_when: >
    crowdsec_bouncer_enroll.rc != 0 and 'already exists' not in (crowdsec_bouncer_enroll.stderr | default(''))

# Registered here, not in the traefik role: the crowdsec container does not exist yet when traefik runs on a fresh host
- name: Enroll Traefik Firewall Bouncer
  community.docker.docker_container_exec:
    container: crowdsec
    command: "cscli bouncers add traefik-bouncer --key {{ crowdsec.traefik_bouncer_key }}"
  register: crowdsec_bouncer_add
  failed_when: >
    crowdsec_bouncer_add.rc != 0 and 'already exists' not in (crowdsec_bouncer_add.stderr | default(''))

- name: Create whitelist in Crowdsec
  community.docker.docker_container_exec:
    container: crowdsec
    command: "cscli allowlist create my_allowlist -d 'my personal IP address'"
  register: crowdsec_allowlist_create
  failed_when: >
    crowdsec_allowlist_create.rc != 0 and 'already exists' not in (crowdsec_allowlist_create.stderr | default(''))

- name: Add personal IP to the whitelist
  community.docker.docker_container_exec:
    container: crowdsec
    command: "cscli allowlist add my_allowlist {{ crowdsec.whitelist_ip_range }}"
  register: crowdsec_allowlist_add
  failed_when: >
    crowdsec_allowlist_add.rc != 0 and 'already exists' not in (crowdsec_allowlist_add.stderr | default(''))
