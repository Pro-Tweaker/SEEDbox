---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ portainer.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: portainer
    image: "portainer/portainer-ce:{{ portainer.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ portainer.folder }}:/data"
      - "/etc/localtime:/etc/localtime:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - name: web
        aliases:
          - portainer
    restart_policy: always
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.portainer.rule: "Host(`{{ portainer.subdomain }}.{{ domain }}`)"
      traefik.http.routers.portainer.entrypoints: "websecure"
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
      # Homer
      homer.enable: "true"
      homer.name: "Portainer"
      homer.service: "Management"
      homer.priority: "300"
      homer.subtitle: "Advanced Docker GUI"
      homer.url: "https://{{ portainer.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/portainer.svg"
      homer.target: "_blank"
