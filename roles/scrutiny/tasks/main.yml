---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
  loop:
    - "{{ scrutiny.folder }}"
    - "{{ scrutiny.folder }}/influxdb2"

# --nodeps keeps whole disks only (no partitions) and, unlike --scsi, also
# reports NVMe and virtio drives. The type column filters out loop/zram/dm.
- name: Get disks
  ansible.builtin.command: lsblk --noheadings --list --nodeps --output name,type
  register: lsblk_disks
  changed_when: false
  check_mode: false

- name: Build the device passthrough list
  ansible.builtin.set_fact:
    scrutiny_devices: >-
      {{ lsblk_disks.stdout_lines
         | select('search', '\sdisk$')
         | map('regex_replace', '^(\S+)\s.*$', '/dev/\1:/dev/\1')
         | list }}

- name: Warn when no disks were found
  ansible.builtin.debug:
    msg: "No disks detected - Scrutiny will start with nothing to monitor."
  when: scrutiny_devices | length == 0

- name: Create and start container
  community.docker.docker_container:
    name: scrutiny
    hostname: "{{ scrutiny.subdomain }}.{{ domain }}"
    image: "ghcr.io/analogj/scrutiny:{{ scrutiny.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ scrutiny.folder }}:/opt/scrutiny/config"
      - "{{ scrutiny.folder }}/influxdb2:/opt/scrutiny/influxdb"
      - "/run/udev:/run/udev:ro"
    devices: "{{ scrutiny_devices }}"
    networks:
      - name: web
        aliases:
          - scrutiny
    restart_policy: unless-stopped
    state: started
    capabilities:
      - SYS_RAWIO
      - SYS_ADMIN
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.scrutiny.rule: "Host(`{{ scrutiny.subdomain }}.{{ domain }}`)"
      traefik.http.routers.scrutiny.entrypoints: "websecure"
      traefik.http.services.scrutiny.loadbalancer.server.port: "8080"
      traefik.http.routers.scrutiny.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "Scrutiny"
      homer.service: "Monitoring"
      homer.priority: "100"
      homer.subtitle: "Hard Drive S.M.A.R.T Monitoring"
      homer.url: "https://{{ scrutiny.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/scrutiny.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz | string }}"
      COLLECTOR_CRON_SCHEDULE: "{{ scrutiny.cron | string }}"
