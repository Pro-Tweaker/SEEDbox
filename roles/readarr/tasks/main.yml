---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ readarr.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: readarr
    image: "ghcr.io/linuxserver/readarr:{{ readarr.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ readarr.folder }}:/config"
      - "{{ data_folder }}:/data"
    networks:
      - name: web
        aliases:
          - readarr
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.readarr.rule: "Host(`{{ readarr.subdomain }}.{{ domain }}`)"
      traefik.http.routers.readarr.entrypoints: "websecure"
      traefik.http.services.readarr.loadbalancer.server.port: "8787"
      traefik.http.routers.readarr.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "Readarr"
      homer.service: "PVR"
      homer.priority: "100"
      homer.subtitle: "Ebook & Audiobook collection manager for Usenet and BitTorrent users"
      homer.url: "https://{{ readarr.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/readarr.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz | string }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"

- name: Wait for 'config.xml' to be created
  ansible.builtin.wait_for:
    path: "{{ readarr.folder }}/config.xml"
    state: present

- name: Wait for 10 seconds
  ansible.builtin.wait_for:
    timeout: 10

- name: Settings Tasks
  ansible.builtin.include_tasks: "settings/main.yml"
