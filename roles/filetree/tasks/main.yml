---
# '{{ data_folder }}' is the root of the data tree: it is bind-mounted as a
# single volume on '/data' in every container, so completed downloads and the
# media library stay on the same filesystem (what hardlinks and atomic moves
# require) and the download clients report the paths the PVRs expect. The one
# exception is rTorrent, whose image hardcodes '/downloads' and therefore
# needs a remote path mapping — see 'roles/rutorrent'.
#
# The symbolic mode below sets the execute bit on directories only (capital
# 'X'), so these come out as 0775.
- name: Create main directory hierarchy
  ansible.builtin.file:
    path: "{{ data_folder }}/{{ item }}"
    state: directory
    owner: "{{ user | string }}"
    group: "{{ group | string }}"
    mode: "u=rwX,g=rwX,o=rX"
  loop:
    - torrents
    - torrents/incomplete
    - torrents/complete
    - usenet
    - usenet/incomplete
    - usenet/complete
    - media

# The download clients drop finished files in '<protocol>/complete/<category>',
# the PVRs then hardlink them into 'media/<category>'.
- name: Create category folders
  ansible.builtin.file:
    path: "{{ data_folder }}/{{ item.0 }}/{{ item.1 }}"
    state: directory
    owner: "{{ user | string }}"
    group: "{{ group | string }}"
    mode: "u=rwX,g=rwX,o=rX"
  loop: "{{ ['torrents/complete', 'usenet/complete', 'media'] | product(filetree_categories) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  vars:
    # Kept in sync with the categories of the download clients.
    filetree_categories:
      - books
      - comics
      - documentaries
      - games
      - mangas
      - misc
      - movies
      - music
      - software
      - tv
