---
- name: Stop and remove any existing container
  community.docker.docker_container:
    name: rutorrent
    state: absent

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ rutorrent.folder }}"
    - "{{ rutorrent.folder }}/rutorrent/conf"
    - "{{ rutorrent.folder }}/rutorrent/plugins"
    - "{{ rutorrent.folder }}/rutorrent/themes"
    - "{{ data_folder }}/torrents/incomplete/rutorrent"

- name: Import custom 'plugins.ini'
  ansible.builtin.copy:
    src: plugins.ini
    dest: "{{ rutorrent.folder }}/rutorrent/conf/plugins.ini"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    force: true

- name: Create and start container
  community.docker.docker_container:
    name: rutorrent
    image: "crazymax/rtorrent-rutorrent:{{ rutorrent.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ rutorrent.folder }}:/data"
      - "{{ rutorrent.folder }}/rutorrent/conf/plugins.ini:/var/www/rutorrent/conf/plugins.ini:ro"
      # This image hardcodes '/data' for its own state and '/downloads' for the
      # download tree ('cfg.basedir' / 'cfg.download' in '.rtlocal.rc', both
      # const). It is therefore the one service that cannot take the single
      # '{{ data_folder }}:/data' mount. '/downloads' is bound to the torrents
      # subtree so paths still resolve to the same host filesystem; the PVRs
      # need a remote path mapping to translate them.
      - "{{ data_folder }}/torrents:/downloads"
    networks:
      - name: web
        aliases:
          - rutorrent
    restart_policy: unless-stopped
    state: started
    ulimits:
      - "nproc:65535:65535"
      - "nofile:32000:40000"
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.rutorrent.rule: "Host(`{{ rutorrent.subdomain }}.{{ domain }}`)"
      traefik.http.routers.rutorrent.entrypoints: "websecure"
      traefik.http.services.rutorrent.loadbalancer.server.port: "8080"
      traefik.http.routers.rutorrent.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "ruTorrent"
      homer.service: "Download"
      homer.priority: "300"
      homer.subtitle: "rTorrent client with a webui"
      homer.url: "https://{{ rutorrent.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/rutorrent.svg"
      homer.target: "_blank"
    published_ports:
      - "{{ rutorrent.bittorrent_port }}:{{ rutorrent.bittorrent_port }}"
      - "{{ rutorrent.dht_port }}:{{ rutorrent.dht_port }}/udp"
    env:
      TZ: "{{ tz | string }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"
      RT_INC_PORT: "{{ rutorrent.bittorrent_port | string }}"
      RT_DHT_PORT: "{{ rutorrent.dht_port | string }}"
