---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ sabnzbd.folder }}"
    - "{{ data_folder }}/usenet/incomplete/sabnzbd"

- name: Create and start container
  community.docker.docker_container:
    name: sabnzbd
    image: "ghcr.io/linuxserver/sabnzbd:{{ sabnzbd.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ sabnzbd.folder }}:/config"
      - "{{ data_folder }}:/data"
    networks:
      - name: web
        aliases:
          - sabnzbd
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.sabnzbd.rule: "Host(`{{ sabnzbd.subdomain }}.{{ domain }}`)"
      traefik.http.routers.sabnzbd.entrypoints: "websecure"
      traefik.http.services.sabnzbd.loadbalancer.server.port: "8080"
      traefik.http.routers.sabnzbd.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "SABnzbd"
      homer.service: "Download"
      homer.priority: "100"
      homer.subtitle: "Automated Usenet download tool"
      homer.url: "https://{{ sabnzbd.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/sabnzbd.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz | string }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"

- name: Settings | Wait for 'sabnzbd.ini' to be created
  ansible.builtin.wait_for:
    path: "{{ sabnzbd.folder }}/sabnzbd.ini"
    state: present

- name: Settings | Wait for 10 seconds before stopping sabnzbd container
  ansible.builtin.wait_for:
    timeout: 10

- name: Settings | Stop container
  community.docker.docker_container:
    name: sabnzbd
    state: stopped

- name: SABnzbd Main Settings Tasks
  ansible.builtin.include_tasks: "settings/main.yml"
- name: Re-Start SABnzbd container
  community.docker.docker_container:
    name: sabnzbd
    state: started
