---
- name: Stop and remove any existing container
  community.docker.docker_container:
    name: watchtower
    state: absent

- name: Create and start container
  community.docker.docker_container:
    name: watchtower
    image: "nickfedor/watchtower:{{ watchtower.tag }}"
    pull: true
    recreate: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart_policy: unless-stopped
    state: started
    env:
      TZ: "{{ tz | string }}"
      WATCHTOWER_MONITOR_ONLY: "{{ watchtower.monitor_only | string }}"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "false"
      # Every day at 05:47 (sec min hour dom mon dow). Keep it off :00: ghcr.io throttles at the top of the hour.
      # 05:47 = well after the 05:00 unattended reboot, done before the 06:00 apt-daily-upgrade/scrutiny/cron.daily cluster.
      WATCHTOWER_SCHEDULE: "0 47 5 * * *"
