---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ jellyfin.folder }}"
    - "{{ data_folder }}/media/tv"
    - "{{ data_folder }}/media/movies"

- name: Create and start container
  community.docker.docker_container:
    name: jellyfin
    image: "ghcr.io/linuxserver/jellyfin:{{ jellyfin.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ jellyfin.folder }}:/config"
      - "{{ data_folder }}/media/tv:/data/tvshows"
      - "{{ data_folder }}/media/movies:/data/movies"
    networks:
      - name: web
        aliases:
          - jellyfin
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.jellyfin.rule: "Host(`{{ jellyfin.subdomain }}.{{ domain }}`)"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      # Homer
      homer.enable: "true"
      homer.name: "Jellyfin"
      homer.service: "Media"
      homer.priority: "300"
      homer.subtitle: "Stream to any device from your own server"
      homer.url: "https://{{ jellyfin.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/jellyfin.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"
