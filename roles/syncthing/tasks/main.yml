---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ syncthing.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: syncthing
    hostname: "{{ syncthing.subdomain }}.{{ domain }}"
    image: "syncthing/syncthing:{{ syncthing.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ syncthing.folder }}:/var/syncthing/config"
      - "{{ data_folder }}:/data"
    networks:
      - name: web
        aliases:
          - syncthing
    restart_policy: unless-stopped
    state: started
    labels:
      # Trafik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.syncthing.rule: "Host(`{{ syncthing.subdomain }}.{{ domain }}`)"
      traefik.http.routers.syncthing.entrypoints: "websecure"
      traefik.http.services.syncthing.loadbalancer.server.port: "8384"
      traefik.http.routers.syncthing.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "Syncthing"
      homer.service: "Tools"
      homer.priority: "200"
      homer.subtitle: "Open Source Continuous File Synchronization"
      homer.url: "https://{{ syncthing.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/syncthing.svg"
      homer.target: "_blank"
    published_ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
    env:
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"
