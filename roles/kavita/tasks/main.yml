---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ kavita.folder }}"

# Kavita keeps its libraries in the SQLite database, not in a config file, so
# they are created over the API from 'settings/main.yml'. That needs an admin
# account, which 'POST /api/Account/register' can only create while none exists.
- name: Generate persistent admin credentials if not provided
  ansible.builtin.set_fact:
    kavita_admin_user: "{{ kavita.user | default('') or (domain.split('.') | first) ~ '.kavita' }}"
    kavita_admin_password: >-
      {{ kavita.password | default('') or
         lookup('ansible.builtin.password', kavita.folder + '/.secrets/admin_password',
                length=24, chars=['ascii_letters', 'digits']) }}
  no_log: true

- name: Create and start container
  community.docker.docker_container:
    name: kavita
    image: "ghcr.io/linuxserver/kavita:{{ kavita.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ kavita.folder }}:/config"
      # Kavita only reads the library (covers, bookmarks and progress all live
      # in '/config'), so the media tree is mounted read-only, as for the other
      # consumers.
      - "{{ data_folder }}/media:/data:ro"
    networks:
      - name: web
        aliases:
          - kavita
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.kavita.rule: "Host(`{{ kavita.subdomain }}.{{ domain }}`)"
      traefik.http.routers.kavita.entrypoints: "websecure"
      traefik.http.services.kavita.loadbalancer.server.port: "5000"
      # Homer
      homer.enable: "true"
      homer.name: "Kavita"
      homer.service: "Media"
      homer.priority: "100"
      homer.subtitle: "Fast, feature-rich, cross-platform reading server"
      homer.url: "https://{{ kavita.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/kavita.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz | string }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"

- name: Settings Tasks
  ansible.builtin.include_tasks: "settings/main.yml"
