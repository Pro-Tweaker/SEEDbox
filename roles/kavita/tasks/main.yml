---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ kavita.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: kavita
    image: "ghcr.io/linuxserver/kavita:{{ kavita.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ kavita.folder }}:/config"
      - "{{ data_folder }}/media:/data:ro"
    networks:
      - name: web
        aliases:
          - kavita
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.kavita.rule: "Host(`{{ kavita.subdomain }}.{{ domain }}`)"
      traefik.http.routers.kavita.entrypoints: "websecure"
      traefik.http.services.kavita.loadbalancer.server.port: "5000"
      # Homer
      homer.enable: "true"
      homer.name: "Kavita"
      homer.service: "Media"
      homer.priority: "100"
      homer.subtitle: "Fast, feature-rich, cross-platform reading server"
      homer.url: "https://{{ kavita.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/kavita.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz | string }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"
