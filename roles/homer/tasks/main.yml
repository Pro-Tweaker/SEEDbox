---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ homer.folder }}"
    - "{{ homer.folder }}/discovery"

- name: Create and start Homer container
  community.docker.docker_container:
    name: homer
    image: "b4bz/homer:{{ homer.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ homer.folder }}:/www/assets"
    networks:
      - name: web
        aliases:
          - homer
    restart_policy: unless-stopped
    state: started
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.homer.rule: "Host(`{{ domain }}`)"
      traefik.http.routers.homer.entrypoints: "websecure"
      traefik.http.services.homer.loadbalancer.server.port: "8080"
      traefik.http.routers.homer.middlewares: "authelia@docker"
      # Upstream dashboard icons only, served without Authelia. Keep the file-name class strict (no '%', '/' or '.'):
      # config.yml, discovery/ and .git must stay behind the router above.
      traefik.http.routers.homer-icons.rule: "Host(`{{ domain }}`) && PathRegexp(`^/assets/homer-icons/(svg/[a-z0-9-]+[.]svg|png/[a-z0-9-]+[.]png|webp/[a-z0-9-]+[.]webp)$`)"
      traefik.http.routers.homer-icons.entrypoints: "websecure"
      traefik.http.routers.homer-icons.service: "homer"
      traefik.http.routers.homer-icons.priority: "1000"
      traefik.http.routers.homer-icons.middlewares: "homer-icons-cache@docker"
      traefik.http.middlewares.homer-icons-cache.headers.customresponseheaders.Cache-Control: "public, max-age=86400"
    env:
      INIT_ASSETS: "1"
      TZ: "{{ tz }}"
    user: "{{ uid | int }}:{{ gid | int }}"

- name: Homer Settings Tasks
  ansible.builtin.include_tasks: "settings/main.yml"

- name: Create the management network
  community.docker.docker_network:
    name: management

- name: Create and start Homer Service Discovery container
  community.docker.docker_container:
    name: homer-discovery
    image: "ghcr.io/pro-tweaker/homer-service-discovery:{{ homer.tag_companion }}"
    pull: true
    recreate: true
    volumes:
      - "{{ homer.folder }}/config.yml:/config.yml"
      - "{{ homer.folder }}/discovery/base.yml:/base.yml"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - name: management
        aliases:
          - homer-discovery
    restart_policy: unless-stopped
    state: started
    env:
      LOG_LEVEL: "Debug"
      HOMER_CONFIG: "/config.yml"
      HOMER_BASE_CONFIG: "/base.yml"
