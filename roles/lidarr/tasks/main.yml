---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
    recurse: true
  loop:
    - "{{ lidarr.folder }}"

- name: Create and start container
  community.docker.docker_container:
    name: lidarr
    image: "ghcr.io/linuxserver/lidarr:{{ lidarr.tag }}"
    pull: true
    recreate: true
    volumes:
      - "{{ lidarr.folder }}:/config"
      - "{{ data_folder }}:/data"
    networks:
      - name: web
        aliases:
          - lidarr
    restart_policy: unless-stopped
    state: started
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.lidarr.rule: "Host(`{{ lidarr.subdomain }}.{{ domain }}`)"
      traefik.http.routers.lidarr.entrypoints: "websecure"
      traefik.http.services.lidarr.loadbalancer.server.port: "8686"
      traefik.http.routers.lidarr.middlewares: "authelia@docker"
      # Homer
      homer.enable: "true"
      homer.name: "Lidarr"
      homer.service: "PVR"
      homer.priority: "200"
      homer.subtitle: "Music collection manager for Usenet and BitTorrent users"
      homer.url: "https://{{ lidarr.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/lidarr.svg"
      homer.target: "_blank"
    env:
      TZ: "{{ tz }}"
      PUID: "{{ uid | string }}"
      PGID: "{{ gid | string }}"

- name: Wait for 'config.xml' to be created
  ansible.builtin.wait_for:
    path: "{{ lidarr.folder }}/config.xml"
    state: present

- name: Wait for 10 seconds
  ansible.builtin.wait_for:
    timeout: 10

- name: Settings Tasks
  ansible.builtin.include_tasks: "settings/main.yml"
