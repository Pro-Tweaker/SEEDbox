---
- name: Read Radarr API Key Value
  community.general.xml:
    path: "{{ radarr.folder }}/config.xml"
    xpath: /Config/ApiKey
    content: text
  register: api_info

- name: Get infos on Radarr container
  community.docker.docker_container_info:
    name: radarr
  register: container_info

- name: "Wait for Radarr API to come up and returns a status 200"
  ansible.builtin.uri:
    url: "http://{{ container_info.container.NetworkSettings.Networks.web.IPAddress }}:7878/api/v3/system/status"
    headers:
      X-Api-Key: "{{ api_info.matches[0].ApiKey }}"
  register: api_result
  until: api_result.status == 200
  retries: 30
  delay: 1

- name: "Add Root Folder"
  ansible.builtin.uri:
    url: "http://{{ container_info.container.NetworkSettings.Networks.web.IPAddress }}:7878/api/v3/rootFolder"
    method: POST
    status_code:
      - 201
      - 400
    body: "{{ lookup('ansible.builtin.template', role_path + '/templates/post_rootfolder_body.json.j2') }}"
    body_format: json
    headers:
      X-Api-Key: "{{ api_info.matches[0].ApiKey }}"

- name: "Add Download Client"
  ansible.builtin.uri:
    url: "http://{{ container_info.container.NetworkSettings.Networks.web.IPAddress }}:7878/api/v3/downloadclient"
    method: POST
    status_code:
      - 201
      - 400
    body: "{{ lookup('ansible.builtin.template', role_path + '/templates/post_downloadclient_body.json.j2') }}"
    body_format: json
    headers:
      X-Api-Key: "{{ api_info.matches[0].ApiKey }}"
